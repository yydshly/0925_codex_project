<text x="94" y="1563" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">边说边显示</text>
<text x="94" y="1594" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">后续音频到来时可能修订</text>
