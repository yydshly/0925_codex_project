<text x="1094" y="1563" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">文字、JSON、SRT / VTT</text>
<text x="1094" y="1594" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">WebSocket / REST / Python</text>
<rect x="70" y="1631" width="710" height="131" rx="16" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="96" y="1680" font-size="26" fill="#173328" font-weight="800" text-anchor="start">可选增强</text>
<text x="96" y="1719" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">说话人编号、文字翻译、会话术语上下文</text>
<rect x="820" y="1631" width="710" height="131" rx="16" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="846" y="1680" font-size="26" fill="#173328" font-weight="800" text-anchor="start">运行底座与可选项</text>
<text x="846" y="1719" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">Python · FastAPI/WebSocket · 识别模型与权重</text>
<text x="846" y="1748" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">LiveKit 非必需；翻译/分人/其他后端按需安装</text>
<text x="70" y="1845" font-size="18" fill="#155b44" font-weight="800" text-anchor="start" letter-spacing="2">03 / 场景</text>
<text x="70" y="1893" font-size="36" fill="#173328" font-weight="800" text-anchor="start">什么时候会用到？</text>
<rect x="70" y="1930" width="347" height="132" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="90" y="1984" font-size="25" fill="#173328" font-weight="800" text-anchor="start">实时字幕</text>
<text x="90" y="2027" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">会议、访谈、直播</text>
<rect x="441" y="1930" width="347" height="132" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="461" y="1984" font-size="25" fill="#173328" font-weight="800" text-anchor="start">内容整理</text>
<text x="461" y="2027" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">录音转稿、制作字幕</text>
<rect x="812" y="1930" width="347" height="132" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="832" y="1984" font-size="25" fill="#173328" font-weight="800" text-anchor="start">客服记录</text>
<text x="832" y="2027" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">多人对话与时间线</text>
<rect x="1183" y="1930" width="347" height="132" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="1203" y="1984" font-size="25" fill="#173328" font-weight="800" text-anchor="start">语音助手输入</text>
<text x="1203" y="2027" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">把讲话交给业务系统</text>
<text x="70" y="2109" font-size="18" fill="#155b44" font-weight="800" text-anchor="start" letter-spacing="2">04 / 对我们的意义</text>
<text x="70" y="2157" font-size="36" fill="#173328" font-weight="800" text-anchor="start">当前先验证效果，实时需求明确后再深挖</text>
<rect x="70" y="2183" width="710" height="210" rx="18" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<rect x="70" y="2183" width="9" height="210" rx="4" fill="#d9744e" stroke="#d9744e" stroke-width="0"/>
<text x="101" y="2232" font-size="21" fill="#155b44" font-weight="800" text-anchor="start">现在 · 录制与成片为主</text>
<text x="101" y="2281" font-size="31" fill="#173328" font-weight="800" text-anchor="start">先看效果，不急着集成</text>
<text x="101" y="2323" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">003 Voicebox 已覆盖一部分听写。</text>
<text x="101" y="2356" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">用自己的中文音频小样本对照即可。</text>
<rect x="820" y="2183" width="710" height="210" rx="18" fill="#123c2e" stroke="#123c2e" stroke-width="2"/>
<rect x="820" y="2183" width="9" height="210" rx="4" fill="#d9744e" stroke="#d9744e" stroke-width="0"/>
<text x="851" y="2232" font-size="21" fill="#acd6b8" font-weight="800" text-anchor="start">以后 · 需要实时互动时</text>
<text x="851" y="2281" font-size="31" fill="#fffefa" font-weight="800" text-anchor="start">再研究流式工程能力</text>
<text x="851" y="2323" font-size="21" fill="#d5e5d9" font-weight="400" text-anchor="start">重点测文字确认延迟、准确度、并发</text>
<text x="851" y="2356" font-size="21" fill="#d5e5d9" font-weight="400" text-anchor="start">以及和现有项目的接口衔接。</text>
<text x="70" y="2443" font-size="22" fill="#155b44" font-weight="800" text-anchor="start">可探索的组合（尚未集成验证）</text>
