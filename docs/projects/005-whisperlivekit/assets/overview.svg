<text x="112" y="1132" font-size="18" fill="#d9744e" font-weight="800" text-anchor="start">01</text>
<text x="112" y="1175" font-size="27" fill="#173328" font-weight="800" text-anchor="start">接收与缓冲</text>
<text x="112" y="1215" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">解码连续音频</text>
<text x="112" y="1246" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">保留必要的上下文</text>
<rect x="445" y="1095" width="335" height="207" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="467" y="1132" font-size="18" fill="#d9744e" font-weight="800" text-anchor="start">02</text>
<text x="467" y="1175" font-size="27" fill="#173328" font-weight="800" text-anchor="start">语音活动检测</text>
<text x="467" y="1215" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">识别说话与静音</text>
<text x="467" y="1246" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">减少无声段计算</text>
<rect x="800" y="1095" width="335" height="207" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="822" y="1132" font-size="18" fill="#d9744e" font-weight="800" text-anchor="start">03</text>
<text x="822" y="1175" font-size="27" fill="#173328" font-weight="800" text-anchor="start">识别模型</text>
<text x="822" y="1215" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">Whisper 系列为默认路线</text>
<text x="822" y="1246" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">亦可选已适配的其他模型</text>
<rect x="1155" y="1095" width="335" height="207" rx="15" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="1177" y="1132" font-size="18" fill="#d9744e" font-weight="800" text-anchor="start">04</text>
<text x="1177" y="1175" font-size="27" fill="#173328" font-weight="800" text-anchor="start">稳定文字判断</text>
<text x="1177" y="1215" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">AlignAtt：避开音频末端</text>
<text x="1177" y="1246" font-size="20" fill="#52645b" font-weight="400" text-anchor="start">LocalAgreement：一致前缀</text>
<text x="90" y="1328" font-size="18" fill="#52645b" font-weight="400" text-anchor="start">不同识别后端的流式策略可能不同。</text>
