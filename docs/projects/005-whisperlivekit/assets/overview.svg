<text x="165" y="93" font-size="17" fill="#fffefa" font-weight="800" text-anchor="middle" letter-spacing="1.8">PROJECT 005</text>
<text x="70" y="176" font-size="60" fill="#173328" font-weight="800" text-anchor="start">一张图看懂 WhisperLiveKit</text>
<text x="70" y="231" font-size="25" fill="#52645b" font-weight="400" text-anchor="start">把持续音频变成可逐步显示、确认和复用的文字。核心任务仍是语音转文字。</text>
<text x="1490" y="93" font-size="19" fill="#155b44" font-weight="700" text-anchor="end">研究概览 · 2026.09.25</text>
