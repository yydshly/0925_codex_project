<text x="97" y="2640" font-size="22" fill="#aa593d" font-weight="800" text-anchor="start">能力边界</text>
<text x="97" y="2675" font-size="21" fill="#6b5b52" font-weight="400" text-anchor="start">它不负责语音合成或数字人画面；实时不等于零延迟；说话人编号不等于真实身份。</text>
