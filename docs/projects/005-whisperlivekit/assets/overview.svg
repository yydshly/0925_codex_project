<text x="70" y="347" font-size="18" fill="#155b44" font-weight="800" text-anchor="start" letter-spacing="2">01 / 关系</text>
<text x="70" y="395" font-size="36" fill="#173328" font-weight="800" text-anchor="start">三个名字，各管一层</text>
<rect x="70" y="430" width="460" height="225" rx="20" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<rect x="95" y="452" width="7" height="31" rx="3" fill="#155b44" stroke="#155b44" stroke-width="0"/>
<text x="118" y="477" font-size="18" fill="#155b44" font-weight="800" text-anchor="start">模型</text>
<text x="98" y="523" font-size="30" fill="#173328" font-weight="800" text-anchor="start">Whisper</text>
<text x="98" y="564" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">把一段语音识别成文字</text>
<text x="98" y="596" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">提供基础识别能力</text>
<line x1="98" y1="609" x2="500" y2="609" stroke="#d7e2d8" stroke-width="2"/>
<text x="98" y="637" font-size="18" fill="#70847a" font-weight="700" text-anchor="start">可被本项目作为识别后端</text>
<rect x="570" y="430" width="460" height="225" rx="20" fill="#123c2e" stroke="#123c2e" stroke-width="2"/>
<rect x="595" y="452" width="7" height="31" rx="3" fill="#d9744e" stroke="#d9744e" stroke-width="0"/>
<text x="618" y="477" font-size="18" fill="#acd6b8" font-weight="800" text-anchor="start">本次研究对象</text>
<text x="598" y="523" font-size="30" fill="#fffefa" font-weight="800" text-anchor="start">WhisperLiveKit</text>
<text x="598" y="564" font-size="21" fill="#d4e8d9" font-weight="400" text-anchor="start">接音频、做流式处理</text>
<text x="598" y="596" font-size="21" fill="#d4e8d9" font-weight="400" text-anchor="start">逐步输出文字事件</text>
<line x1="598" y1="609" x2="1000" y2="609" stroke="#547461" stroke-width="2"/>
<text x="598" y="637" font-size="18" fill="#acd6b8" font-weight="700" text-anchor="start">默认可用 Whisper，也支持其他后端</text>
<rect x="1070" y="430" width="460" height="225" rx="20" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<rect x="1095" y="452" width="7" height="31" rx="3" fill="#155b44" stroke="#155b44" stroke-width="0"/>
<text x="1118" y="477" font-size="18" fill="#155b44" font-weight="800" text-anchor="start">另一套平台</text>
<text x="1098" y="523" font-size="30" fill="#173328" font-weight="800" text-anchor="start">LiveKit</text>
<text x="1098" y="564" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">在参与者之间传输音视频</text>
<text x="1098" y="596" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">管理实时房间与会话</text>
<line x1="1098" y1="609" x2="1500" y2="609" stroke="#d7e2d8" stroke-width="2"/>
<text x="1098" y="637" font-size="18" fill="#70847a" font-weight="700" text-anchor="start">可桥接音频；不是必需依赖</text>
<rect x="70" y="675" width="1460" height="72" rx="13" fill="#e3efe6" stroke="#e3efe6" stroke-width="0"/>
<text x="94" y="720" font-size="25" fill="#155b44" font-weight="700" text-anchor="start">记住：Whisper 负责识别；WhisperLiveKit 负责边听边出字；LiveKit 负责传输实时音视频。</text>
<text x="70" y="773" font-size="18" fill="#155b44" font-weight="800" text-anchor="start" letter-spacing="2">02 / 原理</text>
<text x="70" y="821" font-size="36" fill="#173328" font-weight="800" text-anchor="start">输入 → 实时处理 → 输出</text>
<rect x="70" y="860" width="460" height="150" rx="18" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="94" y="897" font-size="18" fill="#155b44" font-weight="800" text-anchor="start">输入 A</text>
<text x="94" y="943" font-size="28" fill="#173328" font-weight="800" text-anchor="start">网页 / App 麦克风</text>
<text x="94" y="980" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">音频片段持续送入</text>
<rect x="570" y="860" width="460" height="150" rx="18" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="594" y="897" font-size="18" fill="#155b44" font-weight="800" text-anchor="start">输入 B</text>
<text x="594" y="943" font-size="28" fill="#173328" font-weight="800" text-anchor="start">会议或通话音轨</text>
<text x="594" y="980" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">已有 LiveKit 时需自行桥接</text>
<rect x="1070" y="860" width="460" height="150" rx="18" fill="#fffefa" stroke="#d7e2d8" stroke-width="2"/>
<text x="1094" y="897" font-size="18" fill="#155b44" font-weight="800" text-anchor="start">输入 C</text>
<text x="1094" y="943" font-size="28" fill="#173328" font-weight="800" text-anchor="start">录音 / 视频文件</text>
<text x="1094" y="980" font-size="21" fill="#52645b" font-weight="400" text-anchor="start">也支持一次性文件转写</text>
<line x1="800" y1="1020" x2="800" y2="1044" stroke="#d9744e" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="1060" width="1460" height="278" rx="20" fill="#e8f0e9" stroke="#c6d9cb" stroke-width="2"/>
