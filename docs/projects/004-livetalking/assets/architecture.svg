<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
<title id="title">LiveTalking 完整能力架构图</title>
<desc id="desc">左侧是人物图片或视频、文字、现成音频和可选的语音提问。中间是 LiveTalking 的 API、会话、avatar 预处理、音频处理、口型模型推理、画面合成与音画同步。右侧是 WebRTC、RTMP、虚拟摄像头与 MP4 录制。底部列出运行环境、软件库、模型和素材。</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#328e84"/></marker>
  <style>text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .soft{fill:#eaf4f1}</style>
</defs>
<rect x="0" y="0" width="1440" height="1230" rx="0" fill="#f5f8f5" stroke="#f5f8f5" stroke-width="0"/>
<text x="36" y="49" fill="#2a8f87" font-size="13" font-weight="800" text-anchor="start" letter-spacing="2">LIVE TALKING / 一图看全链路</text>
<text x="36" y="90" fill="#102b3c" font-size="32" font-weight="850" text-anchor="start">人物素材 + 声音输入 → 口型画面 → 实时音视频</text>
<text x="36" y="122" fill="#56707a" font-size="16" font-weight="400" text-anchor="start">它是一套实时数字人服务：选择模型、管理会话、同步声音与画面，并输出给浏览器、直播或录制。</text>
<rect x="1080" y="34" width="323" height="76" rx="14" fill="#e8f3ef" stroke="#cce2da" stroke-width="1.5"/>
<text x="1097" y="61" fill="#1f635d" font-size="14" font-weight="800" text-anchor="start">图例</text>
<text x="1097" y="84" fill="#5c7579" font-size="13" font-weight="400" text-anchor="start">实线：主处理链    虚线：按需接入</text>
<text x="36" y="166" fill="#347e76" font-size="15" font-weight="800" text-anchor="start" letter-spacing="1">01  输入 / PREPARE</text>
<text x="373" y="166" fill="#347e76" font-size="15" font-weight="800" text-anchor="start" letter-spacing="1">02  LIVETALKING 服务与模型 / PROCESS</text>
<text x="1122" y="166" fill="#347e76" font-size="15" font-weight="800" text-anchor="start" letter-spacing="1">03  输出 / DELIVER</text>
