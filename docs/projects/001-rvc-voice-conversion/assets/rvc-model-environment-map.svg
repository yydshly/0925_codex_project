<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2940" viewBox="0 0 1800 2940"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#75889b" stroke-width="1.5"/></marker></defs><style>text{font-family:"Microsoft YaHei",sans-serif}</style><rect x="0" y="0" width="1800" height="2940" rx="0" fill="#f9fbfe" stroke="none"/><rect x="0" y="0" width="1800" height="196" rx="0" fill="#132f49" stroke="none"/><text x="56" y="52" font-size="26" font-weight="700" fill="#7ee3d7">RVC · 核心模型 × 环境 × 能力</text><text x="56" y="116" font-size="54" font-weight="700" fill="#fff">本地运行全景图</text><text x="57" y="165" font-size="27" font-weight="400" fill="#d0e0ef">模型提供能力，软件框架运行模型，CPU / 显卡执行计算。</text><text x="1310" y="52" font-size="22" font-weight="400" fill="#d0e0ef">依据 main · 2026-09-25</text><rect x="50" y="226" width="1700" height="52" rx="12" fill="#e9f0f6" stroke="none"/><rect x="50" y="226" width="55" height="52" rx="12" fill="#193c5c" stroke="none"/><text x="65" y="262" font-size="26" font-weight="700" fill="#fff">01</text><text x="126" y="262" font-size="31" font-weight="700" fill="#233b54">三个核心模型：通常共用一套环境，由 RVC 统一调用</text><rect x="55" y="307" width="270" height="84" rx="16" fill="#edf3f8" stroke="none"/><text x="79" y="350" font-size="28" font-weight="700" fill="#233b54">录音 / 麦克风</text><rect x="383" y="307" width="555" height="84" rx="16" fill="#e6f4f2" stroke="none"/><text x="407" y="350" font-size="28" font-weight="700" fill="#233b54">A 提取发音  ＋  B 估计音高</text><rect x="999" y="307" width="427" height="84" rx="16" fill="#efe9f8" stroke="none"/><text x="1023" y="350" font-size="28" font-weight="700" fill="#233b54">C 按目标声线生成</text><rect x="1486" y="307" width="264" height="84" rx="16" fill="#e6f4f2" stroke="none"/><text x="1510" y="350" font-size="28" font-weight="700" fill="#233b54">新的音频</text><path d="M333 350 H373" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M946 350 H989" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M1434 350 H1476" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="55" y="425" width="550" height="489" rx="18" fill="#e9f7f4" stroke="none"/><rect x="625" y="425" width="550" height="489" rx="18" fill="#fff3e2" stroke="none"/><rect x="1195" y="425" width="550" height="489" rx="18" fill="#efeafb" stroke="none"/><text x="79" y="470" font-size="30" font-weight="700" fill="#0d776f">A · 语音特征模型</text><text x="79" y="517" font-size="31" font-weight="700" fill="#0d776f">HuBERT / ContentVec</text><text x="79" y="561" font-size="26" font-weight="700" fill="#233b54">能力：从录音提取发音特征</text><text x="79" y="608" font-size="22" font-weight="400" fill="#607082">本地文件</text><text x="79" y="645" font-size="24" font-weight="400" fill="#536579">assets/hubert_base/</text><text x="79" y="678" font-size="24" font-weight="400" fill="#536579">pytorch_model.bin</text><text x="79" y="711" font-size="24" font-weight="400" fill="#536579">config.json</text><text x="79" y="744" font-size="24" font-weight="400" fill="#536579">preprocessor_config.json</text><text x="79" y="801" font-size="24" font-weight="700" fill="#0d776f">加载依赖：Transformers + PyTorch</text><text x="79" y="846" font-size="23" font-weight="400" fill="#536579">通常使用现成权重；多个声线可共用。</text><text x="79" y="879" font-size="23" font-weight="400" fill="#536579">当前版本使用本地 Transformers 格式。</text><text x="649" y="470" font-size="30" font-weight="700" fill="#a76313">B · 音高提取模型</text><text x="649" y="517" font-size="31" font-weight="700" fill="#a76313">RMVPE</text><text x="649" y="561" font-size="26" font-weight="700" fill="#233b54">能力：从录音估计基频 F0 走势</text><text x="649" y="608" font-size="22" font-weight="400" fill="#607082">CPU / NVIDIA 常见路线</text><text x="649" y="645" font-size="24" font-weight="400" fill="#536579">assets/rmvpe/rmvpe.pt</text><text x="649" y="681" font-size="24" font-weight="400" fill="#536579">运行依赖：PyTorch</text><text x="649" y="738" font-size="24" font-weight="700" fill="#a76313">Windows DirectML 路线</text><text x="649" y="778" font-size="23" font-weight="400" fill="#536579">assets/rmvpe/rmvpe.onnx</text><text x="649" y="814" font-size="23" font-weight="400" fill="#536579">运行依赖：ONNX Runtime DirectML</text><text x="649" y="850" font-size="23" font-weight="400" fill="#536579">这是另一条执行路线，不是第四个模型。</text><text x="649" y="888" font-size="22" font-weight="400" fill="#607082">采用其他音高方法时，资源需求会变化。</text><text x="1219" y="470" font-size="30" font-weight="700" fill="#7450a4">C · 核心声音生成模型</text><text x="1219" y="517" font-size="31" font-weight="700" fill="#7450a4">RVC 目标声线生成器</text><text x="1219" y="561" font-size="26" font-weight="700" fill="#233b54">能力：根据输入条件生成新波形</text><text x="1219" y="608" font-size="22" font-weight="400" fill="#607082">本地权重</text><text x="1219" y="647" font-size="25" font-weight="400" fill="#233b54">assets/weights/声线名.pth</text><text x="1219" y="699" font-size="24" font-weight="700" fill="#7450a4">运行依赖：RVC 网络代码 + PyTorch</text><text x="1219" y="746" font-size="23" font-weight="400" fill="#536579">常见带 F0 结构：VITS 衍生网络</text><text x="1219" y="781" font-size="23" font-weight="400" fill="#536579">内含 NSF / HiFi-GAN 类波形生成模块</text><text x="1219" y="816" font-size="23" font-weight="400" fill="#536579">这些结构已在 RVC 代码中实现。</text><text x="1219" y="875" font-size="23" font-weight="700" fill="#7450a4">无需再单独安装一套 VITS 或声码器。</text><rect x="55" y="939" width="1690" height="101" rx="14" fill="#edf1f6" stroke="none"/><text x="79" y="978" font-size="27" font-weight="700" fill="#233b54">可选辅助：assets/indices/*.index → FAISS 检索 → 混合 A 的特征 → 送入 C</text><text x="79" y="1014" font-size="24" font-weight="400" fill="#536579">索引是目标录音的特征数据，不是神经网络模型。带 F0 的常见流程使用 B；无 F0 模型可省略 B。</text><rect x="50" y="1082" width="1700" height="52" rx="12" fill="#e9f0f6" stroke="none"/><rect x="50" y="1082" width="55" height="52" rx="12" fill="#193c5c" stroke="none"/><text x="65" y="1118" font-size="26" font-weight="700" fill="#fff">02</text><text x="126" y="1118" font-size="31" font-weight="700" fill="#233b54">共用的软件环境：模型文件要通过这些代码才能运行</text><rect x="55" y="1162" width="390" height="191" rx="16" fill="#edf3f8" stroke="none"/><text x="79" y="1205" font-size="27" font-weight="700" fill="#233b54">Python 3.12 x64</text><text x="79" y="1246" font-size="24" font-weight="400" fill="#536579">运行 RVC 的基础环境</text><text x="79" y="1282" font-size="24" font-weight="400" fill="#536579">建议用项目独立虚拟环境</text><rect x="465" y="1162" width="395" height="191" rx="16" fill="#edf3f8" stroke="none"/><text x="489" y="1205" font-size="27" font-weight="700" fill="#233b54">PyTorch / Torchaudio</text><text x="489" y="1246" font-size="24" font-weight="400" fill="#536579">执行 A、B、C 的模型计算</text><text x="489" y="1282" font-size="24" font-weight="400" fill="#536579">按硬件路线安装匹配版本</text><rect x="880" y="1162" width="430" height="191" rx="16" fill="#edf3f8" stroke="none"/><text x="904" y="1205" font-size="27" font-weight="700" fill="#233b54">音频与数字处理</text><text x="904" y="1246" font-size="24" font-weight="400" fill="#536579">FFmpeg / FFprobe</text><text x="904" y="1282" font-size="24" font-weight="400" fill="#536579">Librosa、SoundFile</text><text x="904" y="1318" font-size="24" font-weight="400" fill="#536579">NumPy、SciPy</text><rect x="1330" y="1162" width="415" height="191" rx="16" fill="#edf3f8" stroke="none"/><text x="1354" y="1205" font-size="27" font-weight="700" fill="#233b54">界面与音频设备</text><text x="1354" y="1246" font-size="24" font-weight="400" fill="#536579">Gradio：网页操作</text><text x="1354" y="1282" font-size="24" font-weight="400" fill="#536579">SoundDevice / FreeSimpleGUI</text><text x="1354" y="1318" font-size="24" font-weight="400" fill="#536579">实时输入输出与操作界面</text><rect x="55" y="1373" width="1690" height="88" rx="12" fill="#e8f0fa" stroke="none"/><text x="79" y="1410" font-size="25" font-weight="400" fill="#233b54">模型专用依赖：A 需要 Transformers；B 的 DirectML 路线需要 ONNX Runtime；索引需要 FAISS。</text><text x="79" y="1445" font-size="24" font-weight="400" fill="#536579">上述组件安装在同一套环境中；浏览器负责操作，模型在 Python 程序中计算。</text><rect x="50" y="1503" width="1700" height="52" rx="12" fill="#e9f0f6" stroke="none"/><rect x="50" y="1503" width="55" height="52" rx="12" fill="#193c5c" stroke="none"/><text x="65" y="1539" font-size="26" font-weight="700" fill="#fff">03</text><text x="126" y="1539" font-size="31" font-weight="700" fill="#233b54">先选硬件路线，再安装对应依赖；三条路线不要混装</text><rect x="55" y="1583" width="550" height="353" rx="16" fill="#eaf2fe" stroke="none"/><text x="79" y="1626" font-size="28" font-weight="700" fill="#233b54">NVIDIA 显卡</text><text x="79" y="1667" font-size="24" font-weight="400" fill="#536579">前提：显卡与驱动兼容</text><text x="79" y="1703" font-size="24" font-weight="400" fill="#536579">RTX 50 系：Torch 2.7.1 + cu128</text><text x="79" y="1739" font-size="24" font-weight="400" fill="#536579">更早系列：官方提供 2.7.1 + cu118</text><text x="79" y="1775" font-size="24" font-weight="400" fill="#536579">对应安装清单：</text><text x="79" y="1811" font-size="24" font-weight="400" fill="#536579">requirments_cu128_py312.txt</text><text x="79" y="1847" font-size="24" font-weight="400" fill="#536579">或 requirments_cu118_py312.txt</text><text x="79" y="1883" font-size="24" font-weight="400" fill="#536579">具体显卡仍需通过兼容性检查。</text><rect x="625" y="1583" width="550" height="353" rx="16" fill="#edf3f8" stroke="none"/><text x="649" y="1626" font-size="28" font-weight="700" fill="#233b54">CPU</text><text x="649" y="1667" font-size="24" font-weight="400" fill="#536579">使用 Torch 2.4.1 CPU 系列</text><text x="649" y="1703" font-size="24" font-weight="400" fill="#536579">对应安装清单：</text><text x="649" y="1739" font-size="24" font-weight="400" fill="#536579">requirments_cpu_py312.txt</text><text x="649" y="1775" font-size="24" font-weight="400" fill="#536579">无需 NVIDIA / CUDA 路线</text><text x="649" y="1811" font-size="24" font-weight="400" fill="#536579">支持离线计算，速度取决于设备。</text><text x="649" y="1847" font-size="24" font-weight="400" fill="#536579">训练通常较慢。</text><rect x="1195" y="1583" width="550" height="353" rx="16" fill="#e9f7f4" stroke="none"/><text x="1219" y="1626" font-size="28" font-weight="700" fill="#233b54">Windows AMD / Intel</text><text x="1219" y="1667" font-size="24" font-weight="400" fill="#536579">使用 CPU 依赖清单安装</text><text x="1219" y="1703" font-size="24" font-weight="400" fill="#536579">torch-directml 提供推理加速</text><text x="1219" y="1739" font-size="24" font-weight="400" fill="#536579">RMVPE 使用 .onnx 文件</text><text x="1219" y="1775" font-size="24" font-weight="400" fill="#536579">由 ONNX Runtime DirectML 运行</text><text x="1219" y="1811" font-size="24" font-weight="400" fill="#536579">Linux 按当前官方说明走 CPU。</text><text x="1219" y="1847" font-size="24" font-weight="400" fill="#536579">此路线主要说明转换 / 推理。</text><text x="60" y="1977" font-size="24" font-weight="400" fill="#233b54">系统：Windows / Linux；官方推荐 Ubuntu 24.04 x86_64。NVIDIA 路线先装匹配的 Torch，再装其余依赖。</text><text x="60" y="2015" font-size="24" font-weight="400" fill="#536579">内存、显存与磁盘占用随模型、音频和训练规模变化；环境能启动，不代表一定达到实时速度。</text><rect x="50" y="2057" width="1700" height="52" rx="12" fill="#e9f0f6" stroke="none"/><rect x="50" y="2057" width="55" height="52" rx="12" fill="#193c5c" stroke="none"/><text x="65" y="2093" font-size="26" font-weight="700" fill="#fff">04</text><text x="126" y="2093" font-size="31" font-weight="700" fill="#233b54">按需追加：训练声线和分离人声各有额外资源</text><rect x="55" y="2137" width="830" height="267" rx="16" fill="#efeafb" stroke="none"/><text x="79" y="2180" font-size="29" font-weight="700" fill="#233b54">自己训练声线</text><text x="79" y="2221" font-size="24" font-weight="400" fill="#536579">增加：pretrained/ 或 pretrained_v2/ 的匹配权重</text><text x="79" y="2257" font-size="24" font-weight="400" fill="#536579">包含训练用生成器 G 与判别器 D 的预训练参数</text><text x="79" y="2293" font-size="24" font-weight="400" fill="#536579">还需：目标录音、logs/mute/ 静音样本</text><text x="79" y="2329" font-size="24" font-weight="400" fill="#536579">训练后导出可用于换声的目标 .pth 与可选 .index</text><text x="79" y="2365" font-size="24" font-weight="400" fill="#536579">只使用现成声线转换录音时，无须准备这些训练资源。</text><rect x="915" y="2137" width="830" height="267" rx="16" fill="#fff3e2" stroke="none"/><text x="939" y="2180" font-size="29" font-weight="700" fill="#233b54">分离人声与伴奏</text><text x="939" y="2221" font-size="24" font-weight="400" fill="#536579">增加：assets/pymss_weights/ 中的对应模型</text><text x="939" y="2257" font-size="24" font-weight="400" fill="#536579">通过 PyMSS / MSST 及匹配的运行环境执行</text><text x="939" y="2293" font-size="24" font-weight="400" fill="#536579">用途：先从音乐中取得人声，便于后续换声</text><text x="939" y="2329" font-size="24" font-weight="400" fill="#536579">这些模型是附加能力，不属于基础换声必需项。</text><rect x="50" y="2446" width="1700" height="52" rx="12" fill="#e9f0f6" stroke="none"/><rect x="50" y="2446" width="55" height="52" rx="12" fill="#193c5c" stroke="none"/><text x="65" y="2482" font-size="26" font-weight="700" fill="#fff">05</text><text x="126" y="2482" font-size="31" font-weight="700" fill="#233b54">环境准备完成后，哪些组合提供哪些能力？</text><rect x="55" y="2525" width="1060" height="56" rx="10" fill="#edf3f8" stroke="none"/><text x="78" y="2563" font-size="27" font-weight="400" fill="#233b54">基础环境 + A + B + C</text><path d="M1125 2553 H1193" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1210" y="2525" width="535" height="56" rx="10" fill="#e5f5f1" stroke="none"/><text x="1234" y="2563" font-size="26" font-weight="700" fill="#0b756c">录音 / 歌声换声</text><rect x="55" y="2596" width="1060" height="56" rx="10" fill="#edf3f8" stroke="none"/><text x="78" y="2634" font-size="27" font-weight="400" fill="#233b54">上述组合 + 实时设备与音频路由</text><path d="M1125 2624 H1193" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1210" y="2596" width="535" height="56" rx="10" fill="#e5f5f1" stroke="none"/><text x="1234" y="2634" font-size="26" font-weight="700" fill="#0b756c">实时变声（延迟需实测）</text><rect x="55" y="2667" width="1060" height="56" rx="10" fill="#edf3f8" stroke="none"/><text x="78" y="2705" font-size="27" font-weight="400" fill="#233b54">基础环境 + A / B + 训练底模 + 目标录音</text><path d="M1125 2695 H1193" fill="none" stroke="#75889b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/><rect x="1210" y="2667" width="535" height="56" rx="10" fill="#e5f5f1" stroke="none"/><text x="1234" y="2705" font-size="26" font-weight="700" fill="#0b756c">训练自己的声线</text><rect x="55" y="2761" width="1690" height="108" rx="14" fill="#132f49" stroke="none"/><text x="80" y="2804" font-size="30" font-weight="700" fill="#fff">下载模型：准备权重文件。安装依赖：让 RVC 代码能加载并运行这些权重。</text><text x="80" y="2848" font-size="27" font-weight="400" fill="#b8e3dc">一套匹配硬件的环境 + 共用基础模型 + 目标声线模型 → 可运行的本地换声系统。</text><text x="58" y="2905" font-size="22" font-weight="400" fill="#61758a">依据：官方 README、依赖清单、HuBERT / RMVPE / RVC 模型加载代码。示意说明，不代表已在本机部署。</text></svg>