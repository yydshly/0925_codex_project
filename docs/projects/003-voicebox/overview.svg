<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2800" viewBox="0 0 1800 2800" role="img" aria-labelledby="title desc">
<title id="title">Voicebox 能力与原理完整引导图</title><desc id="desc">汇总本地模型、支持型号、听写与合成路径、克隆与预置区别、个人工作流、边界和验证步骤。</desc>
<style><![CDATA[
text{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.hero{font-size:76px;font-weight:850;letter-spacing:-3px}.sub{font-size:26px;fill:#cfe0d3}.kicker{font-size:21px;font-weight:850;letter-spacing:2px;fill:#2b7b65}.h2{font-size:39px;font-weight:850;fill:#1b3d32}.h3{font-size:29px;font-weight:800;fill:#194c3d}.body{font-size:23px;fill:#344c40}.small{font-size:20px;fill:#587062}.white{fill:#f4f7ed}.tag{font-size:20px;font-weight:800;fill:#1b6956}.num{font-size:25px;font-weight:900;fill:#de714f}
]]></style>
<rect x="0" y="0" width="1800" height="2800" rx="0" fill="#f4f5ee" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1800" height="310" rx="0" fill="#173b32" stroke="none" stroke-width="1"/>
<text x="80" y="71" class="kicker" style="fill:#93d8bb">VOICEBOX / 一图理解</text>
<text x="80" y="172" class="hero" fill="#f6f8ee">本地语音工作台：听懂，也能替你说</text>
<text x="82" y="224" class="sub">Whisper 听写 + 7 类 TTS 引擎配音 + Qwen3 文本处理；本地推理，可通过 REST / MCP 接入应用。</text>
<text x="82" y="264" class="sub">研究口径：官方仓库、文档与 v0.5.0 发布说明 · 2026-09-25</text>
<rect x="80" y="340" width="516" height="155" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="108" y="384" class="num">01</text>
<text x="161" y="386" class="h3">声音 → 文字</text>
<text x="108" y="448" class="body">口述、转写、整理、自动粘贴</text>
<rect x="642" y="340" width="516" height="155" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="670" y="384" class="num">02</text>
<text x="723" y="386" class="h3">文字 → 声音</text>
<text x="670" y="448" class="body">克隆或预置音色、长文、多轨</text>
<rect x="1204" y="340" width="516" height="155" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="1232" y="384" class="num">03</text>
<text x="1285" y="386" class="h3">接口 → 工作流</text>
<text x="1232" y="448" class="body">REST / MCP 供应用和 AI 助手调用</text>
<rect x="80" y="535" width="1640" height="169" rx="20" fill="#dcece0" stroke="#bad7c2" stroke-width="2"/>
<text x="110" y="584" class="h2">先回答：模型在本地还是远端？</text>
<text x="111" y="628" class="body">默认首次从 Hugging Face 下载权重并缓存，之后在运行后端的设备上由 MLX / PyTorch 推理。</text>
<text x="111" y="662" class="body">桌面版通常是自己的电脑；若主动部署远程后端，模型就在那台机器。外部 AI 助手文本由其服务决定。</text>
<text x="80" y="764" class="h2">支持哪些模型？三类模型，各司其职</text>
<rect x="80" y="795" width="450" height="490" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="108" y="838" class="kicker">01 / 输入模型</text>
<text x="108" y="887" class="h3">Whisper · STT</text>
<text x="108" y="937" class="body">Base</text>
<text x="108" y="975" class="body">Small</text>
<text x="108" y="1013" class="body">Medium</text>
<text x="108" y="1051" class="body">Large</text>
<text x="108" y="1089" class="body">Turbo</text>
<text x="108" y="1171" class="small">录音 → 转写文本</text>
<text x="108" y="1205" class="small">Mac 优先 MLX Whisper</text>
<rect x="555" y="795" width="720" height="490" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="583" y="838" class="kicker">02 / 输出模型</text>
<text x="583" y="887" class="h3">7 类 TTS 引擎 / 10 种权重规格</text>
<text x="583" y="934" class="body">Qwen3-TTS 0.6B / 1.7B · 克隆</text>
<text x="583" y="976" class="body">Qwen CustomVoice 0.6B / 1.7B · 预置</text>
<text x="583" y="1018" class="body">LuxTTS · 克隆 · 英语</text>
<text x="583" y="1060" class="body">Chatterbox Multilingual · 克隆 · 23 种语言</text>
<text x="583" y="1102" class="body">Chatterbox Turbo · 克隆 · 英语</text>
<text x="583" y="1144" class="body">TADA 1B（英语）/ 3B（多语言） · 克隆</text>
<text x="583" y="1186" class="body">Kokoro 82M · 预置</text>
<text x="583" y="1260" class="small">中文优先看 Qwen3-TTS / Chatterbox / TADA 3B</text>
<rect x="1300" y="795" width="420" height="490" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="1328" y="838" class="kicker">03 / 文本模型</text>
<text x="1328" y="887" class="h3">Qwen3 · LLM</text>
<text x="1328" y="937" class="body">0.6B</text>
<text x="1328" y="980" class="body">1.7B</text>
<text x="1328" y="1023" class="body">4B</text>
<text x="1328" y="1120" class="small">听写润色</text>
<text x="1328" y="1156" class="small">声音人格台词生成 / 改写</text>
<text x="1328" y="1192" class="small">与 Qwen3-TTS 不是同一模型</text>
<text x="80" y="1350" class="h2">实现原理：两条处理路径，共享本地后端</text>
<rect x="80" y="1380" width="800" height="325" rx="20" fill="#e5f0e5" stroke="#d0ded2" stroke-width="2"/>
<text x="110" y="1425" class="kicker">A / 语音输入</text>
<text x="110" y="1478" class="body">麦克风 / 全局快捷键</text>
<text x="110" y="1528" class="body">↓  Whisper 本地转写</text>
<text x="110" y="1578" class="body">↓  可选 Qwen3 清理口头语</text>
<text x="110" y="1628" class="body">文字保存到 Captures / 粘贴到应用</text>
<text x="110" y="1681" class="small">Windows / macOS 支持自动粘贴</text>
<rect x="900" y="1380" width="820" height="325" rx="20" fill="#f6e9de" stroke="#d0ded2" stroke-width="2"/>
<text x="930" y="1425" class="kicker">B / 语音输出</text>
<text x="930" y="1478" class="body">文案 + 音色档案 / 参考录音</text>
<text x="930" y="1528" class="body">↓  选择 TTS 引擎并生成波形</text>
<text x="930" y="1578" class="body">↓  长文分块、交叉淡化、可选音效</text>
<text x="930" y="1628" class="body">本地音频 + SQLite 记录 / Stories 多轨</text>
<text x="930" y="1681" class="small">Tauri + React → FastAPI 队列 → MLX / PyTorch</text>
<text x="80" y="1772" class="h2">“克隆”和“预置”，差别在哪里？</text>
<rect x="80" y="1800" width="800" height="210" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="110" y="1848" class="h3">声音克隆 · 5 类引擎</text>
<text x="110" y="1893" class="body">提供建议 10–30 秒清晰参考语音 → 模型模仿音色。</text>
<text x="110" y="1927" class="body">零样本条件生成；无需为这个人重新训练模型权重。</text>
<text x="110" y="1961" class="body">适合自己的声音或已获授权的角色声音。</text>
<rect x="900" y="1800" width="820" height="210" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="930" y="1848" class="h3">预置音色 · 2 类引擎</text>
<text x="930" y="1893" class="body">不需要参考录音，直接从已有声音中选。</text>
<text x="930" y="1927" class="body">Qwen CustomVoice 9 个音色；Kokoro 50 个音色。</text>
<text x="930" y="1961" class="body">适合快速配音；不能指望复刻特定人物。</text>
<text x="80" y="2084" class="h2">对你的意义：接入个人 IP 内容工作流</text>
<rect x="80" y="2114" width="1640" height="230" rx="20" fill="#173b32" stroke="none" stroke-width="1"/>
<text x="112" y="2164" class="num">1</text>
<text x="112" y="2210" class="h3" style="fill:#f6f8ee">口述想法</text>
<text x="112" y="2250" class="sub" style="fill:#cde4d4">Whisper 转写</text>
<text x="500" y="2164" class="num">2</text>
<text x="500" y="2210" class="h3" style="fill:#f6f8ee">整理文案</text>
<text x="500" y="2250" class="sub" style="fill:#cde4d4">本地 Qwen3 可选</text>
<text x="890" y="2164" class="num">3</text>
<text x="890" y="2210" class="h3" style="fill:#f6f8ee">生成配音</text>
<text x="890" y="2250" class="sub" style="fill:#cde4d4">Voicebox 克隆 / 预置</text>
<text x="1283" y="2164" class="num">4</text>
<text x="1283" y="2210" class="h3" style="fill:#f6f8ee">发布内容</text>
<text x="1283" y="2250" class="sub" style="fill:#cde4d4">social-auto-upload</text>
<text x="113" y="2311" class="sub" style="fill:#d1e6d7">已有语音需换声时可研究 RVC；Voicebox 的核心是“文字 → 选定音色语音”和“语音 → 文字”。</text>
<text x="80" y="2416" class="h2">边界与采用前验证</text>
<rect x="80" y="2445" width="1640" height="220" rx="20" fill="#fffefa" stroke="#d0ded2" stroke-width="2"/>
<text x="108" y="2492" class="body">边界  语言范围按引擎看：23 种只属于 Chatterbox Multilingual；英语专用引擎不能承担中文任务。</text>
<text x="108" y="2538" class="body">资源  模型首次下载约 350 MB–8 GB；最低 8 GB 内存、建议 16 GB；CPU 推理通常较慢。</text>
<text x="108" y="2584" class="body">安全  只用自己或获授权的声音；代码 MIT 不等于模型权重同许可；REST / MCP 远程开放需加认证。</text>
<text x="108" y="2630" class="body">验证  用自己的中文样本测转写、相似度、长文衔接、速度、稳定性，再决定是否进入正式流程。</text>
<text x="80" y="2732" class="small">来源：docs.voicebox.sh · github.com/jamiepine/voicebox（README / model-management / architecture / v0.5.0）</text>
<text x="80" y="2766" class="small">本图是独立研究整理；网页有逐项出处与详细说明。</text>
</svg>