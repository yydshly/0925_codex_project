<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Fay 能力一图总览</title>
  <desc id="desc">用户说话、打字或定时触发后，Fay 连接语音识别、知识和记忆、MCP 业务工具、大模型和语音合成，向网页、数字人或机器人终端输出文字、语音与动作信号。还支持流式回答、打断、多用户、多端和可替换模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9f2"/><stop offset="1" stop-color="#eaf2e9"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#193747"/><stop offset="1" stop-color="#10232f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#233a42" flood-opacity=".11"/></filter>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
      .ink{fill:#142b33}.muted{fill:#5f7476}.white{fill:#fff}.soft{fill:#b9d0d4}.green{fill:#d8f48d}.mono{font-family:Consolas,"Courier New",monospace}
      .title{font-size:62px;font-weight:750;letter-spacing:-3px}.sub{font-size:25px}.label{font-size:20px;font-weight:700}.body{font-size:22px}.mini{font-size:18px}.step{font-size:25px;font-weight:700}.foot{font-size:18px}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1465" cy="40" r="260" fill="#dff0d9" opacity=".65"/>
  <circle cx="73" cy="1030" r="240" fill="#dfe9fb" opacity=".5"/>
  <rect x="70" y="43" width="176" height="43" rx="21" fill="#142b33"/>
  <text x="158" y="71" text-anchor="middle" class="mono white" font-size="18" font-weight="700">006 / FAY</text>
  <text x="1530" y="72" text-anchor="end" class="mono muted" font-size="19" letter-spacing="2">一图看懂它能做什么</text>
  <text x="70" y="158" class="title ink">Fay 让数字人能</text>
  <text x="562" y="158" class="title" fill="#2d5aec">听、查、答、说。</text>
  <text x="72" y="211" class="sub muted">配置模型和业务接口后，它把一次提问组织成完整的回应。</text>

  <rect x="70" y="262" width="1460" height="624" rx="30" fill="#fff" filter="url(#shadow)"/>

  <rect x="106" y="300" width="304" height="548" rx="24" fill="#edf3ff"/>
  <circle cx="146" cy="347" r="21" fill="#d5e2ff"/>
  <text x="146" y="354" text-anchor="middle" class="mono" fill="#2d5aec" font-size="18" font-weight="700">1</text>
  <text x="183" y="354" class="label ink">交互触发</text>
  <text x="139" y="408" class="mini muted">例如，你问：</text>
  <rect x="136" y="434" width="242" height="126" rx="20" fill="#fff"/>
  <text x="157" y="481" class="body ink" font-weight="700">“我的预约</text>
  <text x="157" y="520" class="body ink" font-weight="700">是几点？”</text>
  <path d="M158 560l24 0-18 16z" fill="#fff"/>
  <circle cx="154" cy="641" r="15" fill="#2d5aec"/>
  <path d="M154 632v12m-6-8v4a6 6 0 0 0 12 0v-4m-6 10v6m-6 0h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <text x="183" y="648" class="body ink">说话或打字</text>
  <circle cx="154" cy="712" r="15" fill="#2d5aec"/>
  <circle cx="154" cy="712" r="5" fill="none" stroke="#fff" stroke-width="2.4"/>
  <path d="M154 702v-3m0 23v-3m-10-7h-3m26 0h-3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="183" y="719" class="body ink">定时主动播报</text>
  <text x="139" y="800" class="mini muted">来自网页、App 或硬件</text>

  <path d="M419 573h34" stroke="#2d5aec" stroke-width="5" stroke-linecap="round"/>
  <path d="M443 563l15 10-15 10" fill="none" stroke="#2d5aec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="468" y="300" width="666" height="548" rx="25" fill="url(#core)"/>
  <circle cx="519" cy="351" r="22" fill="#d8f48d"/>
  <path d="M508 352h6m4-6h3m4 6h6m-13 7h3" stroke="#17333d" stroke-width="4" stroke-linecap="round"/>
  <text x="556" y="359" class="white" font-size="31" font-weight="750">Fay 负责交互编排</text>
  <text x="502" y="401" class="mini soft">这些能力按问题需要组合使用</text>

  <rect x="500" y="429" width="602" height="85" rx="15" fill="#284654"/>
  <circle cx="540" cy="470" r="23" fill="#d8f48d"/>
  <text x="540" y="477" text-anchor="middle" class="mono" fill="#18333d" font-size="17" font-weight="700">01</text>
  <text x="586" y="461" class="step white">听懂问题</text>
  <text x="586" y="491" class="mini soft">语音识别成文字；打字可直接进入</text>
  <rect x="998" y="450" width="80" height="35" rx="17" fill="#456477"/>
  <text x="1038" y="474" text-anchor="middle" class="mono white" font-size="18">ASR</text>

  <rect x="500" y="528" width="602" height="85" rx="15" fill="#284654"/>
  <circle cx="540" cy="570" r="23" fill="#d8f48d"/>
  <text x="540" y="577" text-anchor="middle" class="mono" fill="#18333d" font-size="17" font-weight="700">02</text>
  <text x="586" y="560" class="step white">补足信息</text>
  <text x="586" y="590" class="mini soft">读取知识库、对话记忆和人设</text>
  <rect x="955" y="550" width="123" height="35" rx="17" fill="#456477"/>
  <text x="1016" y="574" text-anchor="middle" class="white" font-size="17">知识 / 记忆</text>

  <rect x="500" y="627" width="602" height="85" rx="15" fill="#284654"/>
  <circle cx="540" cy="669" r="23" fill="#d8f48d"/>
  <text x="540" y="676" text-anchor="middle" class="mono" fill="#18333d" font-size="17" font-weight="700">03</text>
  <text x="586" y="659" class="step white">查询或办事</text>
  <text x="586" y="689" class="mini soft">按需调用预约、订单等业务工具</text>
  <rect x="995" y="649" width="83" height="35" rx="17" fill="#456477"/>
  <text x="1036" y="673" text-anchor="middle" class="mono white" font-size="18">MCP</text>

  <rect x="500" y="726" width="602" height="85" rx="15" fill="#284654"/>
  <circle cx="540" cy="768" r="23" fill="#d8f48d"/>
  <text x="540" y="775" text-anchor="middle" class="mono" fill="#18333d" font-size="17" font-weight="700">04</text>
  <text x="586" y="758" class="step white">组织回应</text>
  <text x="586" y="788" class="mini soft">大模型生成答复，TTS 合成声音</text>
  <rect x="955" y="748" width="123" height="35" rx="17" fill="#456477"/>
  <text x="1016" y="772" text-anchor="middle" class="mono white" font-size="17">LLM / TTS</text>

  <path d="M1144 573h28" stroke="#2d5aec" stroke-width="5" stroke-linecap="round"/>
  <path d="M1162 563l15 10-15 10" fill="none" stroke="#2d5aec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1189" y="300" width="303" height="548" rx="24" fill="#f2f8e5"/>
  <circle cx="1229" cy="347" r="21" fill="#e0edc1"/>
  <text x="1229" y="354" text-anchor="middle" class="mono" fill="#426627" font-size="18" font-weight="700">3</text>
  <text x="1266" y="354" class="label ink">终端呈现</text>
  <circle cx="1340" cy="465" r="77" fill="#d9ebd5"/>
  <circle cx="1340" cy="443" r="28" fill="#386e62"/>
  <path d="M1287 513c2-32 23-51 53-51s51 19 53 51" fill="#386e62"/>
  <path d="M1250 444c-12 12-12 32 0 44m181-44c12 12 12 32 0 44" fill="none" stroke="#8bc5a7" stroke-width="5" stroke-linecap="round"/>
  <rect x="1217" y="568" width="247" height="100" rx="17" fill="#fff"/>
  <text x="1240" y="610" class="body ink" font-weight="700">“预约时间是</text>
  <text x="1240" y="641" class="body ink" font-weight="700">今天 15:00。”</text>
  <rect x="1218" y="710" width="108" height="39" rx="19" fill="#fff"/>
  <text x="1272" y="736" text-anchor="middle" class="mini ink">文字</text>
  <rect x="1335" y="710" width="108" height="39" rx="19" fill="#fff"/>
  <text x="1389" y="736" text-anchor="middle" class="mini ink">声音</text>
  <rect x="1218" y="759" width="225" height="39" rx="19" fill="#fff"/>
  <text x="1330" y="785" text-anchor="middle" class="mini ink">表情 / 动作信号</text>
  <text x="1219" y="827" class="mini muted">由网页、数字人或机器人显示</text>

  <text x="71" y="940" class="ink" font-size="25" font-weight="750">同时具备</text>
  <rect x="70" y="970" width="350" height="78" rx="17" fill="#fff"/>
  <circle cx="105" cy="1009" r="13" fill="#d8f48d"/>
  <text x="137" y="1017" class="body ink" font-weight="650">边生成边回答</text>
  <rect x="438" y="970" width="350" height="78" rx="17" fill="#fff"/>
  <circle cx="473" cy="1009" r="13" fill="#d8f48d"/>
  <text x="505" y="1017" class="body ink" font-weight="650">可打断旧对话</text>
  <rect x="806" y="970" width="350" height="78" rx="17" fill="#fff"/>
  <circle cx="841" cy="1009" r="13" fill="#d8f48d"/>
  <text x="873" y="1017" class="body ink" font-weight="650">支持多用户和多端</text>
  <rect x="1174" y="970" width="356" height="78" rx="17" fill="#fff"/>
  <circle cx="1209" cy="1009" r="13" fill="#d8f48d"/>
  <text x="1241" y="1017" class="body ink" font-weight="650">模型与声音可替换</text>
  <text x="70" y="1090" class="foot muted">Fay 管理对话和信号；角色画面由接入的 2D、3D 或机器人终端呈现。</text>
  <text x="1530" y="1090" text-anchor="end" class="mono muted" font-size="17">资料：Fay 官方仓库 · 2026.09</text>
</svg>
