<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="2050" viewBox="0 0 1800 2050" role="img" aria-labelledby="title desc">
<title id="title">Fay 内部架构与能力全景</title>
<desc id="desc">图分为接入与会话、上下文装配、对话决策与工具执行、输出到数字人终端、异步记忆与平台能力五层。知识库 RAG 是可选的知识检索方式，与长期记忆、预启动工具、业务 MCP 工具不同。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102733"/><stop offset="1" stop-color="#14212c"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11" fill="none" stroke="#a8d8d6" stroke-width="2.2"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .title{font-size:67px;font-weight:780;fill:#fff;letter-spacing:-2px}
    .subtitle{font-size:27px;fill:#b9cdd0}
    .section{font-size:32px;font-weight:760;fill:#f7fff4}
    .meta{font-size:18px;fill:#99b5bf}
    .cardtitle{font-size:29px;font-weight:750;fill:#18303d}
    .body{font-size:23px;fill:#526772}
    .small{font-size:20px;fill:#647982}
    .darktitle{font-size:26px;font-weight:750;fill:#f7fff4}
    .darkbody{font-size:21px;fill:#b6ced0}
    .tag{font-size:17px;font-weight:750;fill:#25414b}
    .label{font-size:19px;font-weight:730;fill:#d8f0d1}
    .band{fill:#1e3947;stroke:#3e5966;stroke-width:2}
    .card{fill:#f4f8fb}
    .mint{fill:#e4f7e7}
    .blue{fill:#e7eeff}
    .lavender{fill:#efe9ff}
    .peach{fill:#ffe9dc}
    .dash{stroke-dasharray:11 8}
    .rule{stroke:#8cb0b6;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1800" height="2050" fill="url(#bg)"/>
<circle cx="1700" cy="80" r="290" fill="#25453d" opacity=".28"/>
<rect x="70" y="60" width="242" height="40" rx="20" fill="#d6f18b"/>
<text x="191" y="87" text-anchor="middle" font-size="18" font-weight="800" fill="#20333b" letter-spacing="2">FAY / SYSTEM MAP</text>
<text x="70" y="174" class="title">Fay 的内部架构，不止 RAG</text>
<text x="70" y="222" class="subtitle">一轮对话的主干是会话管理 + 上下文装配 + Agent 决策；知识检索只是其中一条可选分支。</text>
<rect x="70" y="249" width="18" height="18" rx="3" fill="#eff6fa"/>
<text x="100" y="265" class="meta">核心或可配置能力</text>
<rect x="350" y="249" width="18" height="18" rx="3" fill="#efe9ff" stroke="#c7b0ef" stroke-width="2" stroke-dasharray="5 4"/>
<text x="380" y="265" class="meta">按需接入</text>
<text x="1730" y="265" text-anchor="end" class="meta">依据：Fay README、Prompt、Memory 与 MCP 文档</text>

<!-- 1 input -->
<rect x="55" y="295" width="1690" height="234" rx="26" class="band"/>
<circle cx="97" cy="336" r="19" fill="#d6f18b"/><text x="97" y="344" text-anchor="middle" font-size="20" font-weight="800" fill="#20333b">1</text>
<text x="132" y="347" class="section">接入与会话</text><text x="1710" y="346" text-anchor="end" class="meta">多入口 · 多用户 · 流式 · 唤醒与打断</text>
<rect x="80" y="379" width="390" height="119" rx="15" class="card"/>
<text x="104" y="420" class="cardtitle">语音输入</text><text x="104" y="455" class="body">唤醒 / 收音 / ASR 转文字</text><text x="104" y="482" class="small">可替换语音识别引擎</text>
<rect x="495" y="379" width="390" height="119" rx="15" class="card"/>
<text x="519" y="420" class="cardtitle">文字与接口输入</text><text x="519" y="455" class="body">网页、App、设备或业务系统</text><text x="519" y="482" class="small">文字接口可跳过 ASR</text>
<rect x="910" y="379" width="390" height="119" rx="15" class="mint"/>
<text x="934" y="420" class="cardtitle">主动触发</text><text x="934" y="455" class="body">日程式对话 / 自动播报</text><text x="934" y="482" class="small">不必等待用户先提问</text>
<rect x="1325" y="379" width="390" height="119" rx="15" class="blue"/>
<text x="1349" y="420" class="cardtitle">会话控制</text><text x="1349" y="455" class="body">多用户路由 / 流式会话</text><text x="1349" y="482" class="small">唤醒、打断与状态管理</text>
<path d="M900 529V560" class="rule"/>

<!-- 2 context -->
<rect x="55" y="565" width="1690" height="397" rx="26" class="band"/>
<circle cx="97" cy="606" r="19" fill="#d6f18b"/><text x="97" y="614" text-anchor="middle" font-size="20" font-weight="800" fill="#20333b">2</text>
<text x="132" y="617" class="section">装配本轮上下文</text><text x="1710" y="616" text-anchor="end" class="meta">不同来源各司其职，合并后交给模型</text>
<rect x="80" y="651" width="390" height="207" rx="15" class="card"/>
<text x="104" y="693" class="cardtitle">人设与对话历史</text>
<text x="104" y="732" class="body">系统 Prompt / 当前问题</text>
<text x="104" y="765" class="body">最近对话与角色设定</text>
<rect x="104" y="802" width="157" height="29" rx="14" fill="#dce8ec"/><text x="182" y="823" text-anchor="middle" class="tag">本轮基础信息</text>
<rect x="495" y="651" width="390" height="207" rx="15" class="blue"/>
<text x="519" y="693" class="cardtitle">长期记忆</text>
<text x="519" y="732" class="body">观察 / 对话 / 反思</text>
<text x="519" y="765" class="body">按相关性、时间、重要度召回</text>
<rect x="519" y="802" width="199" height="29" rx="14" fill="#d4e2fc"/><text x="618" y="823" text-anchor="middle" class="tag">独立于知识库 RAG</text>
<rect x="910" y="651" width="390" height="207" rx="15" class="mint"/>
<text x="934" y="693" class="cardtitle">预启动工具</text>
<text x="934" y="732" class="body">模型推理前自动执行</text>
<text x="934" y="765" class="body">如时间、状态、外部数据</text>
<rect x="934" y="802" width="177" height="29" rx="14" fill="#caead4"/><text x="1022" y="823" text-anchor="middle" class="tag">可并行、可配置</text>
<rect x="1325" y="651" width="390" height="207" rx="15" class="lavender" stroke="#c7b0ef" stroke-width="3" stroke-dasharray="11 8"/>
<text x="1349" y="693" class="cardtitle">知识库 RAG · 可选</text>
<text x="1349" y="732" class="body">文档 → Embedding → 检索</text>
<text x="1349" y="765" class="body">可作为 MCP 工具接入</text>
<rect x="1349" y="802" width="309" height="29" rx="14" fill="#ddd2f5"/><text x="1503" y="823" text-anchor="middle" class="tag">可预启动，也可按需调用</text>
<rect x="554" y="885" width="692" height="46" rx="23" fill="#3e626e"/>
<text x="900" y="915" text-anchor="middle" font-size="23" font-weight="770" fill="#f4fff4">合并为本轮模型可读的 Prompt / 工具上下文</text>
<path d="M900 962V993" class="rule"/>

<!-- 3 agent -->
<rect x="55" y="999" width="1690" height="476" rx="26" class="band"/>
<circle cx="97" cy="1040" r="19" fill="#d6f18b"/><text x="97" y="1048" text-anchor="middle" font-size="20" font-weight="800" fill="#20333b">3</text>
<text x="132" y="1051" class="section">对话决策与执行</text><text x="1710" y="1050" text-anchor="end" class="meta">闲聊判断 → 直接回复，或进入工具循环</text>
<rect x="80" y="1090" width="355" height="220" rx="15" class="card"/>
<text x="104" y="1134" class="cardtitle">闲聊判断器</text><text x="104" y="1175" class="body">小模型流式判断：</text><text x="104" y="1208" class="body">finish 还是 tool？</text><text x="104" y="1250" class="small">结构化 JSON 决策</text>
<path d="M437 1154H486" class="rule"/><path d="M437 1259H900" class="rule"/>
<rect x="490" y="1090" width="355" height="142" rx="15" class="mint"/>
<text x="514" y="1134" class="cardtitle">直接回复</text><text x="514" y="1176" class="body">简单闲聊直接流式输出</text><text x="514" y="1207" class="small">不必执行工具</text>
<rect x="902" y="1090" width="390" height="220" rx="15" class="peach"/>
<text x="926" y="1134" class="cardtitle">Agent 工具循环</text>
<text x="926" y="1175" class="body">选工具 → 执行 → 看结果</text>
<text x="926" y="1208" class="body">再决定继续或结束</text>
<text x="926" y="1250" class="small">业务 MCP 工具 / 知识工具</text>
<path d="M1295 1197H1353" class="rule"/>
<rect x="1360" y="1090" width="355" height="220" rx="15" class="card"/>
<text x="1384" y="1134" class="cardtitle">最终回复</text>
<text x="1384" y="1175" class="body">小模型根据工具结果</text>
<text x="1384" y="1208" class="body">组织口语回答并流式输出</text>
<text x="1384" y="1250" class="small">大模型不直接面向用户</text>
<rect x="80" y="1340" width="790" height="97" rx="14" fill="#2d4e5d"/>
<text x="104" y="1377" class="darktitle">运行方式</text>
<text x="104" y="1411" class="darkbody">单模型同步执行；双模型由大模型后台跑工具，小模型负责对话。</text>
<rect x="895" y="1340" width="820" height="97" rx="14" fill="#2d4e5d"/>
<text x="919" y="1377" class="darktitle">后台任务进行中</text>
<text x="919" y="1411" class="darkbody">新消息可识别为进度查询、修改任务、取消、新任务或闲聊。</text>
<path d="M900 1475V1505" class="rule"/>

<!-- 4 output -->
<rect x="55" y="1511" width="1690" height="222" rx="26" class="band"/>
<circle cx="97" cy="1552" r="19" fill="#d6f18b"/><text x="97" y="1560" text-anchor="middle" font-size="20" font-weight="800" fill="#20333b">4</text>
<text x="132" y="1563" class="section">输出与数字人呈现</text><text x="1710" y="1562" text-anchor="end" class="meta">文字直达终端；TTS 与表情信号可按需输出</text>
<rect x="80" y="1601" width="390" height="105" rx="15" class="card"/>
<text x="104" y="1643" class="cardtitle">文字流</text><text x="104" y="1680" class="body">逐段显示对话内容</text>

<rect x="495" y="1601" width="390" height="105" rx="15" class="blue"/>
<text x="519" y="1643" class="cardtitle">TTS 语音 · 按需</text><text x="519" y="1680" class="body">可替换合成引擎</text>

<rect x="910" y="1601" width="390" height="105" rx="15" class="mint"/>
<text x="934" y="1643" class="cardtitle">表达与控制信号</text><text x="934" y="1680" class="body">语音流 / 表情等接口</text>

<rect x="1325" y="1601" width="390" height="105" rx="15" class="card"/>
<text x="1349" y="1643" class="cardtitle">终端渲染</text><text x="1349" y="1680" class="body">网页 / 2D / 3D / 机器人</text>

<!-- 5 async -->
<rect x="55" y="1768" width="1690" height="170" rx="26" class="band"/>
<circle cx="97" cy="1809" r="19" fill="#d6f18b"/><text x="97" y="1817" text-anchor="middle" font-size="20" font-weight="800" fill="#20333b">5</text>
<text x="132" y="1820" class="section">回写与持续运行</text><text x="1710" y="1819" text-anchor="end" class="meta">这些机制会影响下一轮对话</text>
<rect x="80" y="1850" width="795" height="61" rx="13" fill="#2d4e5d"/>
<text x="104" y="1890" class="darkbody">异步评估对话重要性 → 写入长期记忆；定时形成画像与反思。</text>
<rect x="900" y="1850" width="815" height="61" rx="13" fill="#2d4e5d"/>
<text x="924" y="1890" class="darkbody">管理中心配置模型、ASR/TTS、MCP；支持本机与服务端模式。</text>

<text x="70" y="1992" class="label">边界提醒</text>
<text x="191" y="1992" class="meta">RAG = 可选知识检索；长期记忆 = 个人经历召回；MCP = 工具连接协议；Agent 循环 = 选择并执行工具。</text>
<text x="70" y="2025" class="meta">通用 Action / Sentiment 字段属于仓库中的改造方案，不应与默认已实现的画面渲染混为一谈。</text>
</svg>