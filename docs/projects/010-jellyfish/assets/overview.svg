    .num{font-size:19px;font-weight:850;letter-spacing:2px;fill:#22857A}
    .source{font-size:17px;fill:#6B8278}
  </style>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102A28"/><stop offset="1" stop-color="#245C52"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4D9B8A"/></marker>
</defs>
<rect width="1600" height="1990" fill="#F3F7F4"/>
<rect width="1600" height="246" fill="url(#header)"/>
<circle cx="1470" cy="-20" r="220" fill="none" stroke="#A2D8CB" stroke-width="2" opacity=".35"/>
<circle cx="1520" cy="204" r="112" fill="none" stroke="#A2D8CB" stroke-width="2" opacity=".35"/>
<text x="90" y="64" class="eyebrow">010  /  OPEN SOURCE CAPABILITY MAP</text>
<text x="90" y="147" class="title">Jellyfish：AI 短剧生产工作台</text>
<text x="90" y="204" class="subtitle">把剧本、镜头、资产、模型生成和任务追踪连接成可确认的生产流程</text>

<text x="90" y="322" class="kicker">01 / INPUT</text>
<text x="90" y="372" class="section">入口：以分章剧本为主</text>
<rect x="90" y="408" width="612" height="156" rx="20" fill="#FFFFFF" stroke="#D3E4DA" stroke-width="2"/>
<rect x="114" y="432" width="8" height="104" rx="4" fill="#2B9A8B"/>
<text x="145" y="451" class="card-title">推荐输入</text>
<text x="145" y="492" class="body">分章／分集剧本：场景、动作、对白</text>
<text x="145" y="529" class="small">可补充项目风格、人设、参考图和已有素材</text>
<rect x="724" y="408" width="786" height="156" rx="20" fill="#FFF2DF" stroke="#F0CF9F" stroke-width="2"/>
<text x="751" y="451" class="warn-title">小说能直接作为入口吗？</text>
<text x="751" y="492" class="warn-text">文本接口可接收小说段落，但拆镜头提示词按剧本设计。</text>
<text x="751" y="529" class="warn-text">建议先完成小说 → 分集剧本的改编，再进入工作台。</text>

<text x="90" y="652" class="kicker">02 / PRODUCTION FLOW</text>
<text x="90" y="702" class="section">支持的处理：理解、导演辅助、准备、生成</text>
<rect x="90" y="744" width="337" height="407" rx="22" fill="#FFFFFF" stroke="#CFE1DA" stroke-width="2"/>
<rect x="451" y="744" width="337" height="407" rx="22" fill="#FFFFFF" stroke="#CFE1DA" stroke-width="2"/>
<rect x="812" y="744" width="337" height="407" rx="22" fill="#FFFFFF" stroke="#CFE1DA" stroke-width="2"/>
<rect x="1173" y="744" width="337" height="407" rx="22" fill="#FFFFFF" stroke="#CFE1DA" stroke-width="2"/>
<rect x="90" y="744" width="337" height="9" rx="4" fill="#338EB0"/>
<rect x="451" y="744" width="337" height="9" rx="4" fill="#737ABA"/>
<rect x="812" y="744" width="337" height="9" rx="4" fill="#279586"/>
<rect x="1173" y="744" width="337" height="9" rx="4" fill="#C89547"/>
<path d="M431 947H446M440 941L446 947L440 953" fill="none" stroke="#4D9B8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M792 947H807M801 941L807 947L801 953" fill="none" stroke="#4D9B8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1153 947H1168M1162 941L1168 947L1162 953" fill="none" stroke="#4D9B8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<text x="115" y="796" class="num">01 / TEXT MODEL</text>
<text x="115" y="843" class="card-title">剧本理解与编剧辅助</text>
<text x="115" y="890" class="body">• 拆分章节剧本为镜头</text>
<text x="115" y="930" class="body">• 提取角色、场景、</text>
<text x="139" y="964" class="body">道具、服装和对白</text>
<text x="115" y="1007" class="body">• 优化、精简与</text>
<text x="139" y="1041" class="body">一致性检查</text>
<text x="115" y="1084" class="small">结构化结果仍需人工审核</text>

<text x="476" y="796" class="num">02 / SHOT DESIGN</text>
<text x="476" y="843" class="card-title">导演／分镜辅助</text>
<text x="476" y="890" class="body">• 修订镜头标题与信息</text>
<text x="476" y="930" class="body">• 景别、机位、运镜</text>
<text x="476" y="970" class="body">• 首帧／关键帧／尾帧</text>
<text x="500" y="1004" class="body">画面提示词</text>
<text x="476" y="1047" class="body">• 前后镜头连续性</text>
<text x="476" y="1084" class="small">可纳入导演指令约束</text>

<text x="837" y="796" class="num">03 / HUMAN REVIEW</text>
<text x="837" y="843" class="card-title">镜头准备与资产管理</text>
<text x="837" y="890" class="body">• 接受或忽略候选</text>
<text x="837" y="930" class="body">• 关联已有角色、</text>
<text x="861" y="964" class="body">场景、道具、服装</text>
<text x="837" y="1007" class="body">• 管理关键帧与参考图</text>
<text x="837" y="1047" class="body">• 检查镜头是否 ready</text>
<text x="837" y="1084" class="small">人来确认设定和最终取舍</text>

<text x="1198" y="796" class="num">04 / GENERATION</text>
<text x="1198" y="843" class="card-title">生成与任务中心</text>
<text x="1198" y="890" class="body">• 调用外部图像、</text>
<text x="1222" y="924" class="body">视频模型 API</text>
<text x="1198" y="967" class="body">• 单镜头／批量预检查</text>
<text x="1198" y="1007" class="body">• 状态、进度、取消</text>
<text x="1198" y="1047" class="body">• 结果回写镜头和素材</text>
<text x="1198" y="1084" class="small">长耗时任务异步执行</text>

<rect x="90" y="1184" width="1420" height="107" rx="19" fill="#173B34"/>
<text x="120" y="1230" class="dark-title">底层分工</text>
<text x="337" y="1229" class="dark-text">文本模型：理解／提取</text>
<text x="750" y="1229" class="dark-text">图像模型：出图</text>
<text x="1080" y="1229" class="dark-text">视频模型：出片段</text>
<text x="337" y="1265" class="dark-text">Jellyfish 负责数据组织、提示词、人工确认、Provider 接入与任务编排</text>

<text x="90" y="1370" class="kicker">03 / OUTPUT</text>
<text x="90" y="1420" class="section">出口：可复用的制作资料与镜头素材</text>
<rect x="90" y="1454" width="446" height="159" rx="20" fill="#FFFFFF" stroke="#D3E4DA" stroke-width="2"/>
<rect x="550" y="1454" width="446" height="159" rx="20" fill="#FFFFFF" stroke="#D3E4DA" stroke-width="2"/>
<rect x="1010" y="1454" width="500" height="159" rx="20" fill="#FFFFFF" stroke="#D3E4DA" stroke-width="2"/>
<text x="116" y="1502" class="card-title">结构化资料</text>
<text x="116" y="1542" class="body">分镜、对白、实体关系</text>
<text x="116" y="1578" class="small">画面与视频提示词</text>
<text x="576" y="1502" class="card-title">媒体素材</text>
<text x="576" y="1542" class="body">参考／生成图片</text>
<text x="576" y="1578" class="small">单镜头视频片段</text>
<text x="1036" y="1502" class="card-title">生产记录</text>
<text x="1036" y="1542" class="body">任务状态、结果与耗时</text>
<text x="1036" y="1578" class="small">素材关联、回溯与复用</text>

<rect x="90" y="1651" width="690" height="244" rx="22" fill="#E5F2E9"/>
<text x="120" y="1700" class="card-title">对我的价值</text>
<text x="120" y="1742" class="body">系列短剧：复用人设，降低漂移和返工</text>
<text x="120" y="1780" class="body">批量制作：跟踪分镜、任务和素材状态</text>
<text x="120" y="1818" class="body">自建产品：复用开源工作流与数据结构</text>
<text x="120" y="1859" class="small">可衔接配音、剪辑、发布工具；接口需实测</text>

<rect x="802" y="1651" width="708" height="244" rx="22" fill="#FFF1DD"/>
<text x="832" y="1700" class="warn-title">能力边界与下一步核验</text>
<text x="832" y="1742" class="warn-text">整本小说 → 分集剧本：尚需前置改编流程</text>
<text x="832" y="1780" class="warn-text">镜头设计辅助 ≠ 自主导演整部影片</text>
<text x="832" y="1818" class="warn-text">自动剪辑、配音、字幕和成片导出需核验</text>
<text x="832" y="1859" class="warn-text">模型质量、费用与失败率应以真实样片测试</text>

<text x="90" y="1945" class="source">依据：Forget-C/Jellyfish README、剧本处理接口、镜头帧提示词及模型接入代码。2026-09-25 静态研究，未部署实测。</text>
</svg>
