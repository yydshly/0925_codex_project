<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1990" viewBox="0 0 1600 1990" role="img" aria-labelledby="title description">
<title id="title">Jellyfish 一图导读：短剧工作台的输入、处理、输出、原理与价值</title>
<desc id="description">推荐输入为分章剧本和可选参考素材。Jellyfish 使用文本模型拆分镜头、抽取实体和对白，辅助导演设计首帧关键帧尾帧提示词，人工确认并复用资产，调用外部图像与视频模型生成图片和单镜头片段。价值在于多镜头生产与任务追踪；完整小说改编和自动成片需另行处理或验证。</desc>
<defs>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif}
    .eyebrow{font-size:21px;font-weight:800;letter-spacing:3px;fill:#B5EFE3}
