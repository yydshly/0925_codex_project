<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="按顺序整理值得研究的 GitHub 项目，以及对应的笔记、图片和网页演示。">
    <title>GitHub 项目研究 · 项目索引</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f5f7fb; color: #19243a; line-height: 1.7; }
      main { width: min(880px, calc(100% - 36px)); margin: 0 auto; padding: 76px 0 96px; }
      .eyebrow { color: #355ac8; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.2; }
      .intro { max-width: 640px; margin: 0; color: #546178; font-size: 1.05rem; }
      .heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-top: 66px; }
      h2 { margin: 0; font-size: 1.4rem; }
      a { color: #2851bd; text-underline-offset: 3px; }
      .empty { margin-top: 18px; padding: 32px; border: 1px solid #dce3f0; border-radius: 16px; background: #fff; color: #546178; }
      .empty p { margin: 0; }
      footer { margin-top: 52px; color: #68758a; font-size: .9rem; }
      @media (max-width: 520px) { main { padding-top: 48px; } .heading { display: block; } .heading a { display: inline-block; margin-top: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">GitHub Project Research</div>
      <h1>优秀项目研究索引</h1>
      <p class="intro">按收录顺序整理值得深入研究的 GitHub 项目，记录关键做法、图片说明和可访问的网页演示。</p>

      <section aria-labelledby="projects-heading">
        <div class="heading">
          <h2 id="projects-heading">项目列表</h2>
          <a href="https://github.com/yydshly/0925_codex_project">查看仓库与研究笔记</a>
        </div>
        <!-- 新增 Web 演示时，按编号顺序在这里添加项目入口，使用 projects/001-name/ 这样的相对链接。 -->
        <div class="empty"><p>项目正在收录中。首个研究项目上线后，会在这里显示。</p></div>
      </section>

      <footer>详细研究摘要与完整索引见仓库 README。</footer>
    </main>
  </body>
</html>
